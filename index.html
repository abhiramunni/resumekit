<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResumeKit — Your One-Page Resume, Built Right</title>
<meta name="description" content="ResumeKit builds a one-page, ATS-friendly resume with a live preview, three templates, a live ATS score and a bullet coach that turns duties into achievements.">
<meta name="theme-color" content="#faf3e7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf3e7; --paper2:#f2e7d0; --card:#fffaf1; --ink:#241a12; --ink2:#5c4a36; --ink3:#8a7458;
  --bronze:#b4762a; --gold:#d9a441; --terra:#c05b2e; --terra-d:#9c4520; --line:#e3d3b8; --line2:#d8c49a;
  --ok:#2e7d4f; --warn:#b4762a; --bad:#b3361f;
  --shadow:0 10px 30px rgba(36,26,18,.12); --shadow2:0 4px 14px rgba(36,26,18,.10);
  --r:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;line-height:1.08;margin:0}
p{margin:0 0 10px}
a{color:var(--terra)}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink)}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze)}
.helper{color:var(--ink2);font-size:14px}
.muted{color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow2)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:700;font-size:14.5px;text-decoration:none}
.btn.primary{background:var(--terra);border-color:var(--terra);color:#fffaf1}
.btn.primary:hover{background:var(--terra-d)}
.btn.ghost{background:transparent}
.btn.small{padding:7px 13px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--paper2);border:1px solid var(--line2);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;letter-spacing:.04em}
.pill.ok{background:#e2f0e6;color:var(--ok)}
.pill.warn{background:#f7ead2;color:var(--warn)}
.pill.bad{background:#f8e2dc;color:var(--bad)}
.pill.info{background:#efe7d6;color:var(--ink2)}
/* ---- intro ---- */
#intro{position:fixed;inset:0;z-index:90;background:#1d130b;color:#faf3e7;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .6s ease,visibility .6s}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}
#intro .doc{width:74px;height:92px;border:2px solid #d9a441;border-radius:8px;position:relative;animation:docIn .9s ease both}
#intro .doc::before{content:"";position:absolute;left:12px;right:12px;top:16px;height:5px;background:#d9a441;border-radius:3px;box-shadow:0 14px 0 #faf3e7,0 28px 0 #faf3e7,0 42px 0 rgba(250,243,231,.45)}
@keyframes docIn{from{transform:translateY(18px) scale(.92);opacity:0}to{transform:none;opacity:1}}
#intro h1{margin-top:22px;font-size:clamp(34px,7vw,58px);letter-spacing:.06em}
#intro h1 .st{display:block;opacity:0;animation:stIn .7s ease forwards}
#intro h1 .st:nth-child(1){animation-delay:.25s}
#intro h1 .st:nth-child(2){animation-delay:.7s;font-size:.52em;letter-spacing:.02em;color:#d9a441}
#intro h1 .st:nth-child(3){animation-delay:1.15s;font-size:.34em;font-family:Inter,sans-serif;font-weight:500;letter-spacing:.01em;color:rgba(250,243,231,.8)}
@keyframes stIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
#intro .bar{width:min(280px,70vw);height:4px;background:rgba(250,243,231,.2);border-radius:99px;margin-top:30px;overflow:hidden}
#intro .bar i{display:block;height:100%;width:0;background:#d9a441;border-radius:99px;animation:barFill 3.4s ease forwards}
@keyframes barFill{to{width:100%}}
#skipIntro{position:absolute;bottom:26px;right:26px;background:transparent;border:1px solid rgba(250,243,231,.5);color:#faf3e7;border-radius:999px;padding:9px 18px;font-weight:700}
#skipIntro:hover{background:rgba(250,243,231,.12)}
/* ---- header ---- */
header.mast{position:sticky;top:0;z-index:40;background:rgba(250,243,231,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.mast-in{display:flex;align-items:center;gap:14px;padding:12px 0}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo .mark{width:38px;height:38px;border-radius:10px;background:var(--ink);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-weight:900;font-size:19px}
.logo b{font-family:Fraunces,serif;font-size:21px;letter-spacing:.02em}
.logo small{display:block;font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.mast nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.mast nav a{color:var(--ink2);text-decoration:none;font-weight:600;font-size:14px;padding:8px 11px;border-radius:999px}
.mast nav a:hover{background:var(--paper2);color:var(--ink)}
.mast .score-mini{margin-left:6px;display:flex;align-items:center;gap:8px;background:var(--ink);color:#faf3e7;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:800}
.mast .score-mini b{color:var(--gold)}
/* ---- hero ---- */
.hero{position:relative;overflow:hidden;border-radius:0 0 28px 28px}
.hero img.bg{width:100%;height:430px;object-fit:cover;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translateY(0)}to{transform:scale(1.12) translateY(-14px)}}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(29,19,11,.42),rgba(29,19,11,.78))}
.hero .in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:34px 0 40px;color:#faf3e7}
.hero h1{font-size:clamp(34px,5.4vw,58px);max-width:760px}
.hero h1 em{color:var(--gold);font-style:normal}
.hero p.lede{max-width:640px;font-size:17px;color:rgba(250,243,231,.88);margin:12px 0 18px}
.hero .stats{display:flex;gap:10px;flex-wrap:wrap}
.hero .stat{background:rgba(250,243,231,.12);border:1px solid rgba(250,243,231,.35);backdrop-filter:blur(6px);border-radius:14px;padding:10px 16px}
.hero .stat b{display:block;font-size:19px;font-family:Fraunces,serif}
.hero .stat span{font-size:12.5px;color:rgba(250,243,231,.85)}
/* ---- desk split ---- */
.desk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start;padding:26px 0 8px}
.desk-left{display:flex;flex-direction:column;gap:18px;min-width:0}
.desk-right{position:sticky;top:76px;min-width:0}
.sec{padding:20px 22px}
.sec h2{font-size:23px;margin-bottom:4px}
.sec .sub{color:var(--ink2);font-size:14px;margin-bottom:14px}
/* ATS panel */
.ats{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-family:Fraunces,serif;font-size:34px;line-height:1}
.ring .val span{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.ats .body{flex:1;min-width:220px}
.ats .verdict{font-size:17px;font-weight:700;margin:2px 0 10px}
.checks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:7px 14px}
.checks li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink2)}
.checks li svg{flex:none;margin-top:2px}
.checks li.pass{color:var(--ink)}
.checks li.fail{color:var(--ink3)}
.checks li b{font-weight:700}
/* length meter */
.lenbar{height:10px;background:var(--paper2);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.lenbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s ease}
.lenbar i.over{background:var(--bad)}
.lenrow{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600}
.tplrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tpl-btn{border:1.5px solid var(--line2);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:700;font-size:13.5px}
.tpl-btn.on{border-color:var(--terra);background:#fbeede;color:var(--terra-d)}

  /* @@NEXT@@ */
