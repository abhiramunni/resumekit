<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResumeKit — Your One-Page Resume, Built Right</title>
<meta name="description" content="ResumeKit builds a one-page, ATS-friendly resume with a live preview, three templates, a live ATS score and a bullet coach that turns duties into achievements.">
<meta name="theme-color" content="#faf3e7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf3e7; --paper2:#f2e7d0; --card:#fffaf1; --ink:#241a12; --ink2:#5c4a36; --ink3:#8a7458;
  --bronze:#b4762a; --gold:#d9a441; --terra:#c05b2e; --terra-d:#9c4520; --line:#e3d3b8; --line2:#d8c49a;
  --ok:#2e7d4f; --warn:#b4762a; --bad:#b3361f;
  --shadow:0 10px 30px rgba(36,26,18,.12); --shadow2:0 4px 14px rgba(36,26,18,.10);
  --r:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;line-height:1.08;margin:0}
p{margin:0 0 10px}
a{color:var(--terra)}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink)}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze)}
.helper{color:var(--ink2);font-size:14px}
.muted{color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow2)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:700;font-size:14.5px;text-decoration:none}
.btn.primary{background:var(--terra);border-color:var(--terra);color:#fffaf1}
.btn.primary:hover{background:var(--terra-d)}
.btn.ghost{background:transparent}
.btn.small{padding:7px 13px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--paper2);border:1px solid var(--line2);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;letter-spacing:.04em}
.pill.ok{background:#e2f0e6;color:var(--ok)}
.pill.warn{background:#f7ead2;color:var(--warn)}
.pill.bad{background:#f8e2dc;color:var(--bad)}
.pill.info{background:#efe7d6;color:var(--ink2)}
/* ---- intro ---- */
#intro{position:fixed;inset:0;z-index:90;background:#1d130b;color:#faf3e7;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .6s ease,visibility .6s}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}
#intro .doc{width:74px;height:92px;border:2px solid #d9a441;border-radius:8px;position:relative;animation:docIn .9s ease both}
#intro .doc::before{content:"";position:absolute;left:12px;right:12px;top:16px;height:5px;background:#d9a441;border-radius:3px;box-shadow:0 14px 0 #faf3e7,0 28px 0 #faf3e7,0 42px 0 rgba(250,243,231,.45)}
@keyframes docIn{from{transform:translateY(18px) scale(.92);opacity:0}to{transform:none;opacity:1}}
#intro h1{margin-top:22px;font-size:clamp(34px,7vw,58px);letter-spacing:.06em}
#intro h1 .st{display:block;opacity:0;animation:stIn .7s ease forwards}
#intro h1 .st:nth-child(1){animation-delay:.25s}
#intro h1 .st:nth-child(2){animation-delay:.7s;font-size:.52em;letter-spacing:.02em;color:#d9a441}
#intro h1 .st:nth-child(3){animation-delay:1.15s;font-size:.34em;font-family:Inter,sans-serif;font-weight:500;letter-spacing:.01em;color:rgba(250,243,231,.8)}
@keyframes stIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
#intro .bar{width:min(280px,70vw);height:4px;background:rgba(250,243,231,.2);border-radius:99px;margin-top:30px;overflow:hidden}
#intro .bar i{display:block;height:100%;width:0;background:#d9a441;border-radius:99px;animation:barFill 3.4s ease forwards}
@keyframes barFill{to{width:100%}}
#skipIntro{position:absolute;bottom:26px;right:26px;background:transparent;border:1px solid rgba(250,243,231,.5);color:#faf3e7;border-radius:999px;padding:9px 18px;font-weight:700}
#skipIntro:hover{background:rgba(250,243,231,.12)}
/* @@NEXT@@ */
</style>
</head>
<body>
